<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .mensaje {
        position: absolute;
        color: white;
        text-align: center;
        opacity: 0;
        animation: aparecer 2s ease forwards;
        animation-delay: 2.5s;
        text-shadow: 0 0 10px #ff1493,
                     0 0 20px #ff1493;
    }

    .mensaje h1 {
        font-size: 42px;
        margin: 0;
        color: #fff;
    }

    .mensaje p {
        font-size: 20px;
        color: #ff69b4;
        margin-top: 15px;
    }

    @keyframes aparecer {
        from {
            opacity: 0;
            transform: scale(0.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>
</head>

<body>

<canvas id="corazon"></canvas>

<div class="mensaje">
    <h1>I LOVE YOU ❤️</h1>
    <p>Para ti, con mucho amor 💕</p>
</div>

<script>

const canvas = document.getElementById("corazon");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let puntos = [];

const escala = Math.min(
    canvas.width,
    canvas.height
) / 38;

// Crear puntos del corazón

for (let i = 0; i <= 1000; i++) {

    let t = (i / 1000) * Math.PI * 2;

    let x =
        16 * Math.pow(Math.sin(t), 3);

    let y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    puntos.push({
        x: canvas.width / 2 + x * escala,
        y: canvas.height / 2 - y * escala
    });
}


// Corazones pequeños

let corazones = [];

for (let i = 0; i < 20; i++) {

    corazones.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 5 + Math.random() * 10,
        velocidad: 0.3 + Math.random() * 0.8
    });
}


// Brillos

let brillos = [];

for (let i = 0; i < 35; i++) {

    brillos.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 2 + Math.random() * 5,
        alpha: Math.random()
    });
}


// Animación del corazón

let progreso = 0;

function dibujar() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Brillos

    for (let b of brillos) {

        b.alpha += 0.03;

        if (b.alpha > 1) {
            b.alpha = 0;
        }

        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;


    // Corazón

    ctx.beginPath();

    let cantidad =
        Math.floor(progreso);

    for (let i = 0; i < cantidad; i++) {

        let p = puntos[i];

        if (i === 0) {
            ctx.moveTo(p.x, p.y);
        } else {
            ctx.lineTo(p.x, p.y);
        }
    }

    ctx.strokeStyle = "#ff1493";
    ctx.lineWidth = 5;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff1493";

    ctx.stroke();

    ctx.shadowBlur = 0;


    // Corazones pequeños

    for (let c of corazones) {

        c.y -= c.velocidad;

        if (c.y < -20) {
            c.y = canvas.height + 20;
        }

        ctx.fillStyle = "#ff69b4";
        ctx.font = c.size * 2 + "px Arial";

        ctx.fillText(
            "♥",
            c.x,
            c.y
        );
    }


    // Velocidad de formación

    if (progreso < puntos.length) {
        progreso += 15;
    }


    requestAnimationFrame(dibujar);
}

dibujar();


// Ajustar al tamaño del celular

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>

</body>
</html>
