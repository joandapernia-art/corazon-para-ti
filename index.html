<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: black;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .texto-centro {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        text-align: center;

        color: white;
        font-size: 28px;
        font-weight: bold;

        text-shadow:
            0 0 8px #ff1493,
            0 0 18px #ff1493,
            0 0 30px #ff1493;

        opacity: 0;

        animation: aparecer 2s ease forwards;
        animation-delay: 8s;
    }

    .mensaje-final {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);

        width: 90%;
        text-align: center;

        color: #ff69b4;
        font-size: 21px;
        font-style: italic;

        text-shadow:
            0 0 10px #ff1493,
            0 0 20px #ff1493;

        opacity: 0;

        animation: aparecer 2s ease forwards;
        animation-delay: 10s;
    }

    @keyframes aparecer {
        from {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        to {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    }

    .mensaje-final {
        animation-name: aparecerAbajo;
    }

    @keyframes aparecerAbajo {
        from {
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
        }

        to {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    }
</style>
</head>

<body>

<canvas id="corazon"></canvas>

<div class="texto-centro">
    Te amo mi chinita hermosa ❤️
</div>

<div class="mensaje-final">
    Para la niña que tiene mi corazón
</div>

<script>

const canvas = document.getElementById("corazon");
const ctx = canvas.getContext("2d");

function ajustarPantalla() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

ajustarPantalla();

window.addEventListener("resize", ajustarPantalla);


// ==========================================
// CREAR LOS PUNTOS DEL CORAZÓN
// ==========================================

let puntos = [];

for (let i = 0; i <= 1000; i++) {

    let t = (i / 1000) * Math.PI * 2;

    let x = 16 * Math.pow(Math.sin(t), 3);

    let y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    puntos.push({
        x: x,
        y: y
    });
}


// ==========================================
// BRILLOS
// ==========================================

let brillos = [];

for (let i = 0; i < 35; i++) {

    brillos.push({
        x: Math.random(),
        y: Math.random(),
        tamaño: 1 + Math.random() * 4,
        velocidad: 0.01 + Math.random() * 0.02,
        opacidad: Math.random()
    });
}


// ==========================================
// CORAZONES PEQUEÑOS
// ==========================================

let corazones = [];

for (let i = 0; i < 15; i++) {

    corazones.push({
        x: Math.random(),
        y: Math.random(),
        tamaño: 10 + Math.random() * 15,
        velocidad: 0.0005 + Math.random() * 0.001
    });
}


// ==========================================
// ANIMACIÓN
// ==========================================

let progreso = 0;

// MÁS PEQUEÑO = MÁS LENTO
// Antes era muy rápido.
// Ahora avanza lentamente.

const velocidadCorazon = 1.2;


function dibujar() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ======================================
    // BRILLOS
    // ======================================

    for (let b of brillos) {

        b.opacidad += b.velocidad;

        if (b.opacidad > 1) {
            b.opacidad = 0;
        }

        ctx.globalAlpha = b.opacidad;

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            b.x * canvas.width,
            b.y * canvas.height,
            b.tamaño,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;


    // ======================================
    // CORAZÓN
    // ======================================

    let escala =
        Math.min(canvas.width, canvas.height) / 38;


    ctx.beginPath();

    let cantidad = Math.floor(progreso);

    for (let i = 0; i < cantidad; i++) {

        let p = puntos[i];

        let x =
            canvas.width / 2 +
            p.x * escala;

        let y =
            canvas.height / 2 -
            p.y * escala;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }


    ctx.strokeStyle = "#ff1493";
    ctx.lineWidth = 5;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff1493";

    ctx.stroke();

    ctx.shadowBlur = 0;


    // ======================================
    // CORAZONES PEQUEÑOS
    // ======================================

    for (let c of corazones) {

        c.y -= c.velocidad;

        if (c.y < -0.1) {
            c.y = 1.1;
        }

        ctx.fillStyle = "#ff69b4";

        ctx.font = c.tamaño + "px Arial";

        ctx.fillText(
            "♥",
            c.x * canvas.width,
            c.y * canvas.height
        );
    }


    // ======================================
    // FORMAR EL CORAZÓN LENTAMENTE
    // ======================================

    if (progreso < puntos.length) {

        progreso += velocidadCorazon;

    }


    requestAnimationFrame(dibujar);
}

dibujar();

</script>

</body>
</html>
